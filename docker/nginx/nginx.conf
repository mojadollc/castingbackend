worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # ─── Security ─────────────────────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ─── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstream (scale horizontally by adding more app instances) ───────────
    upstream casting_api {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=30s;
        # server app2:3000 max_fails=3 fail_timeout=30s;  # add for horizontal scale
        keepalive 32;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.kidscasting.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers (supplement NestJS helmet)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Auth endpoints — strict rate limit ───────────────────────────────
        location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth burst=5 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
        }

        # ─── Media upload — separate limit ────────────────────────────────────
        location ~ ^/api/v[0-9]+/media/ {
            limit_req zone=upload burst=10 nodelay;
            client_max_body_size 500M;
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
        }

        # ─── Stripe webhook — no rate limit (Stripe IPs only in production) ──
        location ~ ^/api/v[0-9]+/payments/webhook {
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
        }

        # ─── API — general rate limit ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
        }

        # ─── Swagger docs — dev/staging only (remove in production) ──────────
        location /docs {
            # Uncomment to restrict Swagger to internal IPs in production:
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
        }

        # ─── Health check — no rate limit ─────────────────────────────────────
        location /health {
            proxy_pass http://casting_api;
            include /etc/nginx/proxy_params;
            access_log off;
        }
    }
}
